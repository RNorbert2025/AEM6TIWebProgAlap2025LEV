<!DOCTYPE html>
<html lang="hn">
<head>
    <meta charset="UTF-8">
    <title>Grid</title>
    <style>
        body{
            background-color: rgb(0, 162, 255);
        }
        .wrapper{
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            grid-auto-rows: 100px;
        }
        * {
            box-sizing: border-box;
        }

        .wrapper{
            border: 2px;
            border-radius: 5px;
            background-color: #fffffff8;
        }
        .wrapper > div {
            padding: 1em;
            color: #d9480f;
        }
        
    </style>
</head>
<body>
    <div class="wrapper">
        <div>Egy</div>
        <div>Kettő</div>
        <div>Három</div>
        <div>Négy</div>
        <div>Öt</div>
    </div>
</body>
</html>
